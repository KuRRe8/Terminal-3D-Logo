[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-3d-logo"
version = "1.0.0"
description = "在终端里渲染可用鼠标交互的 3D 像素风 Logo（纯 Python，无第三方依赖）"
readme = "README.md"
requires-python = ">=3.6"
keywords = ["terminal", "3d", "logo", "pixel-art", "voxel", "tui"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]

[project.scripts]
logo3d = "terminal_logo.app:main"

[tool.setuptools]
packages = ["terminal_logo"]
